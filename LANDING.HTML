        @layer base {
            html, body {
                margin: 0;
                padding: 0;
                scroll-behavior: smooth;
            }
            body {
                overscroll-behavior: none;
            }
        }

        ::-webkit-scrollbar {
            display: none;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 0; }
            100% { transform: scale(0.95); opacity: 0; }
        }

        .animate-pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes wave-bar {
            0%, 100% { height: 6px; }
            50% { height: 28px; }
        }

        .wave-anim-1 { animation: wave-bar 0.9s ease-in-out infinite; }
        .wave-anim-2 { animation: wave-bar 1.3s ease-in-out infinite 0.2s; }
        .wave-anim-3 { animation: wave-bar 0.7s ease-in-out infinite 0.4s; }
        .wave-anim-4 { animation: wave-bar 1.1s ease-in-out infinite 0.1s; }
        .wave-anim-5 { animation: wave-bar 0.8s ease-in-out infinite 0.3s; }
    </style>
